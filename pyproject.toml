[project]
name = "supplier-scout-agents"
version = "1.0.0"
description = "LangGraph agents that turn an RFQ into a qualified supplier shortlist"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "pydantic>=2.6",
  "rank-bm25>=0.2",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.21"]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
